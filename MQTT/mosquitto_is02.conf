# Mosquitto config for the IS-02 robot (Mosquitto 2.x).
# Since 2.0, Mosquitto with no config only listens on localhost, so the
# Pico W cannot reach it. This file opens port 1883 to the hotspot, and
# port 9001 (WebSockets) for the browser dashboard (dashboard.html).
#
# Windows (PowerShell, in this folder):
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto_is02.conf -v
# macOS/Linux:  mosquitto -c mosquitto_is02.conf -v
#
# Only use this on a private hotspot: there is no password.

listener 1883 0.0.0.0
allow_anonymous true

# browser dashboard
listener 9001
protocol websockets

# keep retained messages (barcode map on is02/map, calibration on
# is02/config) across broker restarts; the file is written in the folder
# Mosquitto was started from
persistence true
persistence_file is02_mosquitto.db
autosave_interval 30
